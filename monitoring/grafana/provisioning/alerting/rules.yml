# Reglas de alerta de Grafana. Para cambiarlas, edita este archivo y reinicia
# Grafana. Se evalúan cada minuto sobre Prometheus. Las etiquetas de cada serie
# (tenant, environment, role, instance, exporter) viajan con la alerta hasta la
# plataforma.
# noDataState OK: un tenant suspendido o eliminado no tiene targets y no alerta.
apiVersion: 1
groups:
  - orgId: 1
    name: tenants
    folder: Asistencia
    interval: 1m
    rules:
      - uid: asistencia-agente-caido
        title: 'Agente caído'
        condition: C
        for: 2m
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: 'El agente {{ $labels.exporter }} de {{ $labels.instance }} no responde a Prometheus (EC2 apagada, servicio detenido o IP del operador cambiada).'
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              refId: A
              instant: true
              expr: '1 - up{job="tenants"}'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
      - uid: asistencia-app-sin-responder
        title: 'App sin responder'
        condition: C
        for: 2m
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: '{{ $labels.instance }} no responde a su chequeo HTTP (en el backend, /api/health incluye la conexión a PostgreSQL).'
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              refId: A
              instant: true
              expr: '1 - max by (tenant, environment, role, instance) (httpcheck_status{job="tenants",role=~"backend|frontend",http_status_class="2xx"})'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
      - uid: asistencia-errores-5xx
        title: 'Aumento de errores 5xx'
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: 'El {{ with $values.A }}{{ humanize .Value }}{{ end }}% de las respuestas de la API de {{ $labels.tenant }} son 5xx en los últimos 5 minutos.'
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              refId: A
              instant: true
              expr: '100 * sum by (tenant, environment) (rate(http_server_request_duration_seconds_count{job="tenants",http_response_status_code=~"5.."}[5m])) / sum by (tenant, environment) (rate(http_server_request_duration_seconds_count{job="tenants"}[5m]))'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [5] }
      - uid: asistencia-latencia-alta
        title: 'Latencia alta de la API'
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: 'La latencia p95 de la API de {{ $labels.tenant }} es de {{ with $values.A }}{{ humanize .Value }}{{ end }} s.'
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              refId: A
              instant: true
              expr: 'histogram_quantile(0.95, sum by (tenant, environment, le) (rate(http_server_request_duration_seconds_bucket{job="tenants"}[5m])))'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [1] }
      - uid: asistencia-cpu-alta
        title: 'CPU alta'
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: 'La CPU de {{ $labels.instance }} está al {{ with $values.A }}{{ humanize .Value }}{{ end }}%.'
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              refId: A
              instant: true
              expr: '100 * (1 - avg by (tenant, environment, role, instance) (rate(node_cpu_seconds_total{job="tenants",mode="idle"}[5m])))'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [90] }
      - uid: asistencia-memoria-alta
        title: 'Memoria alta'
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: 'La memoria de {{ $labels.instance }} está al {{ with $values.A }}{{ humanize .Value }}{{ end }}%.'
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              refId: A
              instant: true
              expr: '100 * (1 - node_memory_MemAvailable_bytes{job="tenants"} / node_memory_MemTotal_bytes{job="tenants"})'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [90] }
      - uid: asistencia-disco-lleno
        title: 'Disco casi lleno'
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: 'El disco raíz de {{ $labels.instance }} está al {{ with $values.A }}{{ humanize .Value }}{{ end }}%.'
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              refId: A
              instant: true
              expr: '100 * (1 - node_filesystem_avail_bytes{job="tenants",mountpoint="/"} / node_filesystem_size_bytes{job="tenants",mountpoint="/"})'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [85] }
