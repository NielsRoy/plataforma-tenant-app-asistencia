# Imagen backend: Node.js, la API ya compilada y su servicio systemd.
# Solo queda lo necesario para ejecutarla: dist/, dependencias de producción y
# package.json. El archivo de entorno con los secretos lo escribe el despliegue.

- name: Instalar Node.js
  ansible.builtin.include_role:
    name: nodejs

- name: Crear el usuario de la API
  ansible.builtin.user:
    name: "{{ api_user }}"
    system: true
    shell: /usr/sbin/nologin
    home: "{{ api_home }}"
    create_home: false

- name: Crear los directorios de la API
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: "{{ api_user }}"
    mode: "0755"
  loop:
    - "{{ api_home }}"
    - "{{ api_home }}/releases"

- name: Clonar y compilar el backend
  ansible.builtin.include_role:
    name: app_build
  vars:
    app_component: server

- name: Quitar las dependencias de desarrollo
  ansible.builtin.command:
    argv: [npm, prune, --omit=dev, --no-audit, --no-fund, --loglevel=error]
    chdir: "{{ app_build_path }}"
  changed_when: true

- name: Definir la carpeta de la versión
  ansible.builtin.set_fact:
    api_release_dir: "{{ api_home }}/releases/{{ app_commit[:12] }}"

- name: Crear la carpeta de la versión
  ansible.builtin.file:
    path: "{{ api_release_dir }}"
    state: directory
    owner: root
    group: "{{ api_user }}"
    mode: "0755"

# El código queda de root: el usuario de la API puede leerlo pero no modificarlo
- name: Copiar solo lo necesario para ejecutar la API
  ansible.builtin.command:
    argv: [cp, -a, dist, node_modules, package.json, package-lock.json, "{{ api_release_dir }}/"]
    chdir: "{{ app_build_path }}"
  changed_when: true

- name: Asignar permisos a la versión
  ansible.builtin.command:
    argv: [chown, -R, "root:{{ api_user }}", "{{ api_release_dir }}"]
  changed_when: true

- name: Apuntar current a la versión
  ansible.builtin.file:
    src: "{{ api_release_dir }}"
    dest: "{{ api_home }}/current"
    state: link

- name: Borrar el código fuente y el swap temporal
  ansible.builtin.include_role:
    name: app_build
    tasks_from: cleanup

# Habilitado, pero no arranca hasta que exista /etc/asistencia/api.env
- name: Crear el servicio de la API
  ansible.builtin.template:
    src: asistencia-api.service.j2
    dest: /etc/systemd/system/asistencia-api.service
    mode: "0644"

- name: Habilitar el servicio de la API
  ansible.builtin.systemd_service:
    name: asistencia-api
    enabled: true
    daemon_reload: true
