# Imagen frontend: nginx con el build de React ya incluido.
# Node.js solo se usa para compilar y se quita al terminar: en la AMI quedan
# únicamente los archivos estáticos. El proxy /api hacia el backend del tenant
# lo agrega el despliegue, porque la IP privada del backend cambia por tenant.

- name: Instalar nginx
  ansible.builtin.apt:
    name: nginx
    state: present

- name: Quitar el sitio por defecto de nginx
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Recargar nginx

- name: Instalar Node.js (solo para compilar)
  ansible.builtin.include_role:
    name: nodejs

- name: Clonar y compilar el frontend
  ansible.builtin.include_role:
    name: app_build
  vars:
    app_component: client

- name: Vaciar el directorio del sitio
  ansible.builtin.file:
    path: "{{ frontend_web_root }}"
    state: absent

- name: Crear el directorio del sitio
  ansible.builtin.file:
    path: "{{ frontend_web_root }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Copiar el build de React al sitio
  ansible.builtin.copy:
    src: "{{ app_build_path }}/dist/"
    dest: "{{ frontend_web_root }}/"
    remote_src: true
    owner: root
    group: root
    mode: u=rwX,go=rX

- name: Borrar el código fuente y el swap temporal
  ansible.builtin.include_role:
    name: app_build
    tasks_from: cleanup

- name: Quitar Node.js
  ansible.builtin.include_role:
    name: nodejs
    tasks_from: remove

- name: Sitio estático (sin proxy al backend todavía)
  ansible.builtin.template:
    src: asistencia-static.conf.j2
    dest: /etc/nginx/sites-available/asistencia.conf
    mode: "0644"
  notify: Recargar nginx

- name: Habilitar el sitio
  ansible.builtin.file:
    src: /etc/nginx/sites-available/asistencia.conf
    dest: /etc/nginx/sites-enabled/asistencia.conf
    state: link
  notify: Recargar nginx

- name: Estado interno de nginx para el OpenTelemetry Collector (solo localhost)
  ansible.builtin.template:
    src: status.conf.j2
    dest: /etc/nginx/conf.d/status.conf
    mode: "0644"
  notify: Recargar nginx

- name: Validar la configuración de nginx
  ansible.builtin.command: nginx -t
  changed_when: false

- name: Habilitar y arrancar nginx
  ansible.builtin.systemd_service:
    name: nginx
    enabled: true
    state: started

- name: Aplicar la configuración de nginx
  ansible.builtin.meta: flush_handlers
